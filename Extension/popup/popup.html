<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Asistente LSC</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Asistente LSC</h1>

    <!-- CONFIGURACIÓN -->

    <div class="card">

        <h3>Modo de traducción</h3>

        <label>
            <input
                type="radio"
                name="modo"
                value="completo"
                checked>

            Traducción + LSC
        </label>

        <br><br>

        <label>
            <input
                type="radio"
                name="modo"
                value="transcripcion">

            Solo transcripción
        </label>

    </div>

    <!-- BOTÓN -->

    <div class="card">

        <button id="startBtn">
            Iniciar traducción
        </button>

        <p id="status">
            Traducción desactivada
        </p>

    </div>

    <script src="popup.js"></script>

</body>

</html>
