<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Asistente LSC</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Asistente LSC</h1>

    <!-- CONFIGURACIÓN REQUERIDA -->

    <div class="card" id="configWarning">

        <h3>Configuración inicial</h3>

        <p>
            Debes configurar el asistente antes de iniciar.
        </p>

        <button id="configBtn">
            Ir a configuración
        </button>

    </div>

    <!-- CONTENIDO PRINCIPAL -->

    <div id="mainContent" style="display: none;">

        <!-- MODO ACTUAL -->

        <div class="card">

            <h3>Modo actual</h3>

            <p id="currentMode">
                Cargando...
            </p>

        </div>

        <!-- BOTÓN TRADUCCIÓN -->

        <div class="card">

            <button id="startBtn">
                Iniciar traducción
            </button>

            <p id="status">
                Traducción desactivada
            </p>

        </div>

        <!-- TEXTO DETECTADO -->

        <div class="card">

            <h3>Texto detectado</h3>

            <p id="detectedText">
                Ninguno
            </p>

        </div>

        <!-- VIDEO -->

        <div class="card">

            <h3>Traducción LSC</h3>

            <video id="videoPlayer" controls autoplay muted>
            </video>

        </div>

        <!-- BOTÓN CONFIG -->

        <div class="card">

            <button id="changeConfigBtn">
                Cambiar configuración
            </button>

        </div>

    </div>

    <script src="popup.js"></script>

</body>

</html>
